# ВАРИАНТ А (рекомендуется, если у живого проекта уже есть домен с https):
# форма на ПУТИ существующего домена — https://ВАШ-ДОМЕН/zakupki/form
# Новый DNS и новый сертификат НЕ нужны — переиспользуем текущие.
#
# Вставьте этот блок ВНУТРЬ существующего server { ... } (того, что слушает 443
# для вашего домена), рядом с другими location. Ничего больше не меняйте.
#
# Проверка пути: /zakupki/ проксируется на локальный веб-сервер бота (порт 8080),
# префикс /zakupki/ срезается (proxy_pass с завершающим слэшем).

location /zakupki/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;   # чтобы проходили фото/PDF счёта
}

# После добавления:
#   sudo nginx -t        # проверить, что конфиг валиден
#   sudo systemctl reload nginx
# WEBAPP_URL в .env тогда: https://ВАШ-ДОМЕН/zakupki/form
