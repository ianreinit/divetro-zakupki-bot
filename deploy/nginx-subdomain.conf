# ВАРИАНТ Б (альтернатива): отдельный ПОДДОМЕН для формы — bot.ВАШ-ДОМЕН
# Нужен DNS-запись (A-запись bot -> IP сервера) и отдельный TLS-сертификат.
# Чуть больше настройки, зато форма полностью изолирована от живого проекта.
#
# 1) Создайте DNS A-запись: bot.ВАШ-ДОМЕН -> IP вашего сервера Hetzner.
# 2) Положите этот файл как /etc/nginx/sites-available/zakupki-bot и включите:
#      sudo ln -s /etc/nginx/sites-available/zakupki-bot /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx
# 4) Выпустите сертификат:
#      sudo certbot --nginx -d bot.ВАШ-ДОМЕН
#    (certbot сам допишет listen 443 и пути к сертификату)
#
# WEBAPP_URL в .env тогда: https://bot.ВАШ-ДОМЕН/form

server {
    listen 80;
    server_name bot.ВАШ-ДОМЕН;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
