<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Комментарии к заявке</title>
<script defer src="telegram_bootstrap.js?v=1"></script>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 20px 16px; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--tg-theme-secondary-bg-color, #f2f2f7); color: var(--tg-theme-text-color, #1c1c1e); }
main { max-width: 560px; margin: auto; }
h1 { font-size: 22px; margin: 0 0 4px; }
p { margin: 8px 0; }
.hint, time { color: var(--tg-theme-hint-color, #696970); font-size: 13px; }
article { margin: 12px 0; padding: 14px; border-radius: 14px; background: var(--tg-theme-bg-color, #fff); }
article p { white-space: pre-wrap; overflow-wrap: anywhere; }
article time { display: block; }
button { cursor: pointer; border: 0; border-radius: 12px; padding: 13px; font: inherit;
  color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, #2481cc); }
button:disabled { opacity: .5; cursor: default; }
.secondary { background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-link-color, #2481cc); }
nav { display: flex; gap: 8px; margin: 16px 0; }
textarea { display: block; width: 100%; margin: 8px 0; padding: 12px; border: 1px solid #8886; border-radius: 12px;
  font: inherit; color: inherit; background: var(--tg-theme-bg-color, #fff); resize: vertical; }
textarea:focus { outline: 2px solid var(--tg-theme-button-color, #2481cc); }
fieldset { padding: 0; border: 0; margin: 16px 0; }
legend { font-weight: 600; margin-bottom: 8px; }
#recipients { display: flex; flex-wrap: wrap; gap: 8px; }
.recipient { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px;
  background: var(--tg-theme-bg-color, #fff); font-size: 14px; }
input { width: 18px; height: 18px; accent-color: var(--tg-theme-button-color, #2481cc); }
#send { width: 100%; }
#status { padding: 12px 0; overflow-wrap: anywhere; }
.error { color: #c63232; }
form { border-top: 1px solid #8883; padding-top: 20px; margin-top: 20px; }
[hidden] { display: none !important; }
</style>
</head>
<body inert>
<main>
  <h1 id="title">Комментарии к заявке</h1>
  <p id="details" class="hint">Загрузка…</p>
  <nav><button id="refresh" class="secondary" type="button">Обновить</button>
    <button id="older" class="secondary" type="button" hidden>Ранее</button></nav>
  <div id="history" aria-live="polite"></div>
  <p id="status" role="status"></p>
  <button id="retry" class="secondary" type="button" hidden>Повторить уведомления</button>
  <form id="form" hidden>
    <label for="body"><strong>Ваш комментарий</strong></label>
    <textarea id="body" rows="3" maxlength="1000" required placeholder="Написать комментарий…"></textarea>
    <fieldset><legend>Кого уведомить</legend>
      <div id="recipients"></div>
      <p class="hint">Если никого не выбрать, комментарий сохранится без рассылки.</p>
    </fieldset>
    <button id="send" type="submit" disabled>Отправить</button>
  </form>
</main>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  try { if (!window.telegramReady) throw new Error('Не удалось загрузить окно. Проверьте соединение.'); await window.telegramReady; }
  catch (error) {
    document.body.inert = false;
    const box = document.createElement('div'); box.setAttribute('role', 'alert');
    box.style.cssText = 'padding:20px;background:#fff0ed;color:#8b2020;position:fixed;inset:0;z-index:100;';
    box.textContent = error.message + ' ';
    const retry = document.createElement('button'); retry.textContent = 'Повторить';
    retry.onclick = () => location.reload(); box.append(retry); document.body.append(box); return;
  }
  document.body.inert = false;

const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const $ = id => document.getElementById(id);
const req = new URLSearchParams(location.search).get('req');
let before = null, busy = false, token = crypto.randomUUID(), previousPayload = null, retryPayload = null;
const messages = {
  auth_failed: 'Откройте комментарии кнопкой в карточке заявки.',
  not_allowed: 'У вас нет доступа к этой заявке.',
  not_found: 'Заявка не найдена.',
  invalid_body: 'Введите комментарий от 1 до 1000 символов.',
  invalid_recipients: 'Состав участников изменился. Обновите страницу и выберите получателей.',
  changed_request: 'Комментарий уже сохранён. Обновите историю перед новой отправкой.'
};
function status(text, isError = false) { $('status').textContent = text; $('status').className = isError ? 'error' : ''; }
async function api(path, data = {}) {
  const response = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({initData: tg?.initData || '', req, ...data})});
  const result = await response.json();
  if (!result.ok) throw new Error(messages[result.error] || 'Не удалось выполнить запрос. Попробуйте ещё раз.');
  return result;
}
function renderComment(comment) {
  const article = document.createElement('article');
  const author = document.createElement('strong');
  author.textContent = `${comment.author_name} · ${comment.author_role}`;
  const date = document.createElement('time');
  date.dateTime = comment.created_at;
  date.textContent = new Date(comment.created_at).toLocaleString('ru-RU', {dateStyle: 'short', timeStyle: 'short'});
  const text = document.createElement('p'); text.textContent = comment.body;
  article.append(author, date, text);
  return article;
}
async function load(earlier = false) {
  $('refresh').disabled = true; $('older').disabled = true;
  try {
    const data = await api('comments_history', earlier ? {before} : {});
    $('title').textContent = `Комментарии к заявке ${data.request.number}`;
    $('details').textContent = `${data.request.supplier} · ${data.request.amount.toLocaleString('ru-RU')} · ${data.request.status}`;
    if (!earlier) {
      $('history').replaceChildren();
      const checked = new Set([...document.querySelectorAll('#recipients input:checked')].map(x => x.value));
      $('recipients').replaceChildren();
      for (const person of data.recipients) {
        const label = document.createElement('label'); label.className = 'recipient';
        const input = document.createElement('input'); input.type = 'checkbox'; input.value = person.id;
        input.checked = checked.has(String(person.id));
        label.append(input, document.createTextNode(person.name === person.role ? person.role : `${person.name} · ${person.role}`));
        $('recipients').append(label);
      }
    }
    const fragment = document.createDocumentFragment();
    data.comments.forEach(comment => fragment.append(renderComment(comment)));
    if (earlier) $('history').prepend(fragment); else $('history').append(fragment);
    if (!$('history').childElementCount) {
      const empty = document.createElement('p'); empty.className = 'hint';
      empty.textContent = 'Комментариев пока нет. Здесь будет вся история обсуждения.';
      $('history').append(empty);
    }
    before = data.before; $('older').hidden = !before; $('form').hidden = false;
  } catch (e) { status(e.message, true); }
  finally { $('refresh').disabled = false; $('older').disabled = false; }
}
function setBusy(value) {
  busy = value;
  $('body').disabled = value;
  document.querySelectorAll('#recipients input').forEach(input => input.disabled = value);
  $('send').disabled = value || !$('body').value.trim();
  $('retry').disabled = value;
  $('send').textContent = value ? 'Сохраняю…' : 'Отправить';
}
async function send(payload, retry = false) {
  setBusy(true); status('');
  try {
    const result = await api('comments_post', payload);
    if (!retry) {
      $('body').value = '';
      document.querySelectorAll('#recipients input').forEach(input => input.checked = false);
      token = crypto.randomUUID(); previousPayload = null;
    }
    retryPayload = result.failed.length ? payload : null;
    $('retry').hidden = !retryPayload;
    await load();
    status(result.failed.length
      ? `Комментарий сохранён. Не удалось уведомить: ${result.failed.join(', ')}.`
      : (payload.recipients.length ? 'Комментарий сохранён. Уведомления отправлены.' : 'Комментарий сохранён без рассылки.'),
      result.failed.length > 0);
    tg?.HapticFeedback?.notificationOccurred('success');
  } catch (e) { status(e.message, true); }
  finally { setBusy(false); }
}
$('body').addEventListener('input', () => { $('send').disabled = busy || !$('body').value.trim(); });
$('form').addEventListener('submit', event => {
  event.preventDefault(); if (busy || !$('body').value.trim()) return;
  const content = {body: $('body').value.trim(), recipients: [...document.querySelectorAll('#recipients input:checked')].map(x => Number(x.value))};
  const signature = JSON.stringify(content);
  if (previousPayload !== null && previousPayload !== signature) token = crypto.randomUUID();
  previousPayload = signature;
  send({...content, submission_id: token});
});
$('retry').addEventListener('click', () => { if (retryPayload && !busy) send(retryPayload, true); });
$('refresh').addEventListener('click', () => { if (!busy) load(); });
$('older').addEventListener('click', () => { if (!busy && before) load(true); });
load();
});
</script>
</body>
</html>
