<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Личный кабинет · DIVETRO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--tg-theme-secondary-bg-color,#f2f4f7);color:var(--tg-theme-text-color,#172535);font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}main{max-width:640px;margin:auto;padding:22px 16px 40px}header,.row{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:24px;letter-spacing:-.6px;margin:3px 0}h2{font-size:21px;margin:20px 0 4px}.hint{color:var(--tg-theme-hint-color,#657587);font-size:13px}.brand{font-size:11px;letter-spacing:2px;color:var(--tg-theme-link-color,#236baf);font-weight:700}button,input,select{font:inherit}button{cursor:pointer;min-height:42px;border:1px solid #8899aa30;border-radius:11px;padding:10px 13px;color:inherit;background:var(--tg-theme-bg-color,#fff)}button:disabled{opacity:.5;cursor:wait}nav{display:flex;padding:5px;gap:4px;margin:24px 0 16px;border-radius:14px;background:var(--tg-theme-bg-color,#fff)}nav button{flex:1;border:0;font-size:14px;padding:10px 4px}button[aria-pressed=true],.primary{background:var(--tg-theme-button-color,#2267a5);color:var(--tg-theme-button-text-color,#fff);border-color:transparent}.filters{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.filters button{font-size:13px}.card,.panel{background:var(--tg-theme-bg-color,#fff);border:1px solid #8899aa25;border-radius:15px;padding:17px;margin:10px 0}.card{display:block;width:100%;text-align:left}.card strong{font-size:16px;font-weight:600}.money{white-space:nowrap;font-variant-numeric:tabular-nums}.small{font-size:13px;margin-top:6px;overflow-wrap:anywhere}.state{color:var(--tg-theme-link-color,#236baf);font-size:13px;margin-top:14px}.total{font-size:32px;font-weight:650;letter-spacing:-1px}.wide{width:100%;margin-top:10px}input,select{width:100%;padding:12px;border:1px solid #8899aa50;border-radius:11px;background:var(--tg-theme-bg-color,#fff);color:inherit;min-width:0}label{display:block;font-size:13px;margin:12px 0 5px}.track{background:#8899aa22;height:5px;border-radius:5px;margin-top:12px}.bar{height:5px;background:var(--tg-theme-button-color,#2267a5);border-radius:5px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#bc3434}#status{font-size:14px}#child{position:fixed;inset:0;background:var(--tg-theme-secondary-bg-color,#f2f4f7);z-index:5;display:flex;flex-direction:column}#childbar{padding:10px 16px;border-bottom:1px solid #8899aa40}iframe{width:100%;flex:1;border:0;background:white}body.child-open{overflow:hidden}[hidden]{display:none!important}@media(max-width:360px){main{padding:18px 12px}.row{flex-wrap:wrap}.total{font-size:28px}}
</style></head><body><main>
<header><div><div class="brand">DIVETRO</div><h1>Личный кабинет</h1><div id="role" class="hint">Загрузка…</div></div><button id="refresh" aria-label="Обновить">↻</button></header>
<nav aria-label="Разделы"><button data-view="tasks" aria-pressed="true">Мои задачи</button><button data-view="search" aria-pressed="false">Поиск</button><button data-view="analytics" aria-pressed="false">Аналитика</button></nav>
<button id="notifications" class="wide" hidden>Отправленные уведомления</button><div id="controls"></div><p id="error" role="alert" hidden></p><p id="status" role="status"></p><section id="content"></section><button id="more" class="wide" hidden>Показать ещё</button>
</main><div id="child" hidden><div id="childbar"><button id="return">← К заявке</button></div><iframe id="frame" title="Действие по заявке"></iframe></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' лей';
const statuses={'потребность':'Нужно оформить','оформлено':'На одобрении','отправлено':'На одобрении','одобрено':'Ожидает оплаты','оплачено':'Оплачено','в_пути':'В пути','получено':'На складе','отклонено':'Отклонено'};
let state={view:'tasks',task:'',query:'',field:'all',period:'month',group:'category',drill:null},selected=null,next=null,seq=0,busy=false;
const errors={auth_failed:'Откройте кабинет через кнопку в Telegram.',not_allowed:'У вас нет доступа. Обратитесь к администратору.',not_found:'Заявка не найдена.',send_failed:'Не удалось открыть карточку в чате. Попробуйте ещё раз.'};
async function api(path,payload={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tg?.initData||'',...payload})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(errors[d.error]||'Не удалось загрузить данные. Нажмите ↻, чтобы повторить.');return d;}
function failure(e){$('error').hidden=false;$('error').textContent=e.message||'Ошибка сети.';}
function card(r){return `<button class="card" data-req="${r.id}"><div class="row"><strong>${esc(r.supplier||r.description||'Потребность')}</strong><span class="money">${r.amount?money(r.amount):'Без суммы'}</span></div><div class="hint small">${esc(r.number)} · ${r.order_no?'Заказ '+esc(r.order_no):'Без заказа'}</div><div class="small">${esc(r.naryad||r.description||'')}</div><div class="state">${esc(statuses[r.status]||r.status)}</div>${r.paid_at?`<div class="hint small">${esc(r.category)} · ${esc(r.receipt)}</div>`:''}</button>`;}
function date(v){return new Date(v).toLocaleDateString('ru-RU');}
function controls(d){
 if(state.view==='tasks')return `<h2>Что требует внимания</h2><div class="hint">Задачи вашей роли в одном месте</div><div class="filters">${d.tasks.map(t=>`<button data-task="${t.key}" aria-pressed="${t.key===state.task}">${esc(t.label)} · ${t.count}</button>`).join('')}</div>`;
 const search=`<form id="searchform"><label for="query">Номер заявки, заказ или поставщик</label><div class="row"><input id="query" maxlength="200" placeholder="Например: 125 или Металл" value="${esc(state.query)}"><button type="submit">Найти</button></div><label for="field">Искать по</label><select id="field">${[['all','Всем полям'],['order','Номеру заказа'],['supplier','Поставщику']].map(([k,l])=>`<option value="${k}" ${state.field===k?'selected':''}>${l}</option>`).join('')}</select></form>`;
 if(state.view==='search')return '<h2>Найти заявки и расходы</h2>'+search;
 return '<h2>Расходы</h2><div class="hint">Только доступные вам оплаченные заявки</div>'+`<div class="filters">${[['week','Неделя'],['month','Месяц'],['year','Год']].map(([k,l])=>`<button data-period="${k}" aria-pressed="${state.period===k}">${l}</button>`).join('')}</div>`+search+`<div class="filters">${[['category','Категории'],['supplier','Поставщики'],['order','Заказы']].map(([k,l])=>`<button data-group="${k}" aria-pressed="${state.group===k}">${l}</button>`).join('')}</div>`;
}
async function load(append=false){
 const ticket=++seq;$('error').hidden=true;$('status').textContent='Загрузка…';$('more').hidden=true;
 try{const d=await api('cabinet_data',{...state,offset:append?next:0});if(ticket!==seq)return;
 if(state.view==='notifications'){
 if(!append){$('controls').innerHTML='<h2>Мои уведомления</h2><div class="hint">История отправки директору</div>';$('content').innerHTML='<div id="items"></div>';}
 $('items').insertAdjacentHTML('beforeend',d.items.map(n=>`<div class="panel"><div style="white-space:pre-wrap">${esc(n.description)}</div><div class="hint small">${esc(new Date(n.created_at).toLocaleString('ru-RU'))}</div><div class="state">${n.sent?'✓ Отправлено директору · оплачено':'Не доставлено директору'}</div></div>`).join('')||'<div class="panel">Уведомлений пока нет.</div>');
 next=d.next_offset;$('more').hidden=next===null;$('status').textContent='';return;}
 $('notifications').hidden=!d.notifications;
 $('role').textContent=d.role;state.task=d.task||state.task;next=d.next_offset;
 if(!append){$('controls').innerHTML=controls(d);document.querySelector('#searchform')?.addEventListener('submit',e=>{e.preventDefault();state.query=$('query').value;state.field=$('field').value;state.drill=null;load();});
 let summary=state.view==='tasks'?`<div class="hint">Заявок: ${d.count}</div>`:`<div class="panel"><div class="hint">${state.view==='analytics'?date(d.start)+' — '+date(d.end)+' · по дате оплаты':'За всё время · оплачено'}</div><div class="total">${money(state.view==='analytics'?d.total:d.paid_total)}</div><div class="hint">${state.view==='search'?'Ожидают оплаты: '+money(d.waiting_total):'Уведомления в свободной форме не входят в расходы'}</div></div>`;
 if(state.view==='analytics'&&!state.drill){summary+=d.groups.map(g=>`<button class="card" data-drill="${esc(g.name)}"><div class="row"><strong>${esc(g.name)}</strong><span class="money">${money(g.amount)}</span></div><div class="track"><div class="bar" style="width:${d.total?Math.min(100,g.amount/d.total*100):0}%"></div></div><div class="hint small">Заявок: ${g.count} · открыть →</div></button>`).join('');$('content').innerHTML=summary+(d.groups.length?'':'<p class="hint">За этот период оплат нет.</p>');next=null;}
 else{$('content').innerHTML=summary+(state.drill?`<button data-backgroups>← К группам</button><h2>${esc(state.drill)}</h2>`:'')+'<div id="items"></div>';}}
 if($('items')){if(!append)$('items').innerHTML='';$('items').insertAdjacentHTML('beforeend',d.items.map(card).join('')||'<div class="panel">Заявок не найдено.</div>');}
 $('more').hidden=next===null;$('status').textContent='';
 }catch(e){if(ticket===seq){failure(e);$('status').textContent='';}}
}
async function detail(id){const ticket=++seq;selected=id;$('error').hidden=true;$('status').textContent='Загрузка заявки…';$('more').hidden=true;
 try{const d=await api('cabinet_detail',{req:id});if(ticket!==seq)return;const r=d.request;$('controls').innerHTML='';$('content').innerHTML=`<button data-back>← К списку</button><h2>${esc(r.supplier||'Потребность')}</h2><div class="hint">${esc(r.number)} · ${esc(r.sector)}</div><div class="total">${r.amount?money(r.amount):'Сумма не указана'}</div><div class="panel"><div>Заказ: ${esc(r.order_no||'Не указан')}</div><div>Наряд: ${esc(r.naryad||'Не указан')}</div><p>${esc(r.description||'')}</p><div class="hint">Подал: ${esc(r.submitted_by_name)} · ${date(r.submitted_at)}</div>${r.needed_by?`<div class="hint">Нужно к: ${esc(r.needed_by)}</div>`:''}<pre>${esc(d.progress)}</pre></div>${d.links.map((l,i)=>`<button class="wide ${i===0?'primary':''}" data-form="${esc(l.url)}">${esc(l.label)}</button>`).join('')}<button class="wide" id="openchat">Открыть карточку в чате</button><p class="hint">Счёт и кнопки одобрения, отклонения или доставки — в карточке. Она придёт вам только по нажатию.</p>`;$('status').textContent='';}catch(e){if(ticket===seq){failure(e);$('status').textContent='';}}
}
function openForm(url){const hash=new URLSearchParams({tgWebAppData:tg?.initData||'',tgWebAppVersion:tg?.version||'6.0',tgWebAppPlatform:tg?.platform||'web',tgWebAppThemeParams:JSON.stringify(tg?.themeParams||{})});$('frame').src=url+'#'+hash;$('child').hidden=false;document.body.classList.add('child-open');}
$('return').onclick=()=>{$('child').hidden=true;$('frame').src='about:blank';document.body.classList.remove('child-open');detail(selected);};
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.view){state.view=b.dataset.view;state.drill=null;selected=null;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));load();}
 else if(b.dataset.task){state.task=b.dataset.task;load();}
 else if(b.dataset.period){state.period=b.dataset.period;state.drill=null;load();}
 else if(b.dataset.group){state.group=b.dataset.group;state.drill=null;load();}
 else if(b.hasAttribute('data-drill')){state.drill=b.dataset.drill;load();}
 else if(b.hasAttribute('data-backgroups')){state.drill=null;load();}
 else if(b.dataset.req)detail(Number(b.dataset.req));
 else if(b.hasAttribute('data-back')){selected=null;load();}
 else if(b.dataset.form)openForm(b.dataset.form);
 else if(b.id==='openchat'&&!busy){busy=true;b.disabled=true;try{await api('cabinet_open',{req:selected});$('status').textContent='Карточка отправлена в ваш чат с ботом.';tg?.close();}catch(e){failure(e);}finally{busy=false;b.disabled=false;}}
});
$('notifications').onclick=()=>{state.view='notifications';selected=null;state.drill=null;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed','false'));load();};
$('refresh').onclick=()=>selected?detail(selected):load();$('more').onclick=()=>load(true);load();
</script></body></html>
