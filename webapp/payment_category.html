<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Категория оплаты</title>
<script defer src="telegram_bootstrap.js?v=1"></script>
<style>
* { box-sizing: border-box; }
body { margin:0; padding:24px 16px; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:var(--tg-theme-secondary-bg-color,#f2f2f7); color:var(--tg-theme-text-color,#1c1c1e); }
main { max-width:480px; margin:auto; }
h1 { font-size:23px; margin:0 0 8px; }
#amount { font-size:28px; font-weight:600; margin:8px 0; }
.hint { font-size:14px; color:var(--tg-theme-hint-color,#64646b); }
#categories { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:24px 0; }
button { font:inherit; border:1px solid transparent; border-radius:13px; padding:16px 10px; cursor:pointer;
background:var(--tg-theme-bg-color,#fff); color:var(--tg-theme-link-color,#1675ba); min-height:58px; }
button.current { border-color:var(--tg-theme-link-color,#1675ba); }
button:disabled { opacity:.55; cursor:default; }
#close { width:100%; margin-top:16px; background:var(--tg-theme-button-color,#2481cc); color:var(--tg-theme-button-text-color,#fff); }
#error { color:#c63232; }
[hidden] { display:none!important; }
</style>
</head>
<body inert>
<main>
<h1 id="title">Оплата</h1>
<div id="number" class="hint">Загрузка…</div>
<div id="supplier"></div>
<div id="amount"></div>
<p id="hint" class="hint"></p>
<div id="categories"></div>
<p id="error" role="alert" hidden></p>
<p id="success" role="status" hidden></p>
<button id="retry" hidden>Повторить загрузку</button>
<button id="close">Закрыть</button>
</main>
<script>
window.addEventListener('DOMContentLoaded', async () => {
  try { if (!window.telegramReady) throw new Error('Не удалось загрузить окно. Проверьте соединение.'); await window.telegramReady; }
  catch (error) {
    document.body.inert = false;
    const box = document.createElement('div'); box.setAttribute('role', 'alert');
    box.style.cssText = 'padding:20px;background:#fff0ed;color:#8b2020;position:fixed;inset:0;z-index:100;';
    box.textContent = error.message + ' ';
    const retry = document.createElement('button'); retry.textContent = 'Повторить';
    retry.onclick = () => location.reload(); box.append(retry); document.body.append(box); return;
  }
  document.body.inert = false;

const tg=window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
const req=params.get('req'); const mode=params.get('mode')==='edit'?'edit':'pay';
let busy=false;
const errors={auth_failed:'Откройте окно кнопкой в заявке.',not_allowed:'Категорию назначает только бухгалтер.',
  already_paid:'Эта заявка уже оплачена. Закройте окно: актуальная категория указана в карточке.',
  not_approved:'Заявка ещё не одобрена или её статус изменился.',not_paid:'Сначала необходимо оплатить заявку.',
  not_found:'Заявка не найдена.',invalid_category:'Неизвестная категория.'};
async function api(path,extra={}) {
  const response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData:tg?.initData||'',req,mode,...extra})});
  const result=await response.json();
  if(!result.ok) { const e=new Error(errors[result.error]||'Не удалось выполнить действие. Попробуйте ещё раз.'); e.code=result.error; throw e; }
  return result;
}
function error(e) { $('error').textContent=e.message||'Сеть недоступна.'; $('error').hidden=false; }
async function load() {
  $('error').hidden=true; $('retry').hidden=true; $('categories').replaceChildren();
  try {
    const data=await api('payment_category_info');
    $('title').textContent=mode==='edit'?'Изменить категорию':'Оплата';
    $('number').textContent=data.request.number;
    $('supplier').textContent=data.request.supplier;
    $('amount').textContent=data.request.amount.toLocaleString('ru-RU');
    if(!data.allowed) { $('hint').textContent=`Текущий статус: ${data.request.status}. Закройте окно и откройте актуальную карточку.`; return; }
    $('hint').textContent=mode==='edit'?'Выберите новую категорию. Отметка оплаты не изменится.':'Выберите категорию — оплата подтвердится сразу.';
    for(const [key,label] of Object.entries(data.categories)) {
      const button=document.createElement('button'); button.type='button'; button.textContent=label;
      if(key===data.request.category) { button.className='current'; button.textContent+=' ✓'; }
      button.addEventListener('click',()=>choose(key)); $('categories').append(button);
    }
  } catch(e) { error(e); $('retry').hidden=false; }
}
async function choose(category) {
  if(busy)return; busy=true; $('error').hidden=true;
  const buttons=[...$('categories').querySelectorAll('button')]; buttons.forEach(b=>b.disabled=true);
  try {
    const result=await api('payment_category_submit',{category});
    $('categories').hidden=true; $('hint').hidden=true;
    $('success').textContent=(mode==='edit'?'Категория изменена: ':'✅ Оплачено · ')+result.category;
    $('success').hidden=false; tg?.HapticFeedback?.notificationOccurred('success');
  } catch(e) {
    error(e);
    if(['already_paid','not_approved','not_paid','not_allowed'].includes(e.code)) $('categories').hidden=true;
    else buttons.forEach(b=>b.disabled=false);
  } finally { busy=false; }
}
$('close').addEventListener('click',()=>tg?.close());
$('retry').addEventListener('click',load);
load();
});
</script>
</body>
</html>
