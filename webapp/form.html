<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Новая потребность</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --section-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --field-bg: var(--tg-theme-bg-color, #ffffff);
    --border: rgba(128,128,128,.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--section-bg); color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
  input, select, textarea {
    width: 100%; padding: 12px 14px; font-size: 16px;
    color: var(--text); background: var(--field-bg);
    border: 1px solid var(--border); border-radius: 12px; outline: none;
    appearance: none; -webkit-appearance: none;
    font-family: inherit;
  }
  textarea { resize: none; min-height: 80px; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2.5'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat: no-repeat; background-position: right 14px center; padding-right: 40px;
  }
  .urgency-row { display: flex; gap: 8px; margin-top: 6px; }
  .urgency-btn {
    flex: 1; padding: 10px 8px; text-align: center; font-size: 14px; font-weight: 500;
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--field-bg); color: var(--text); cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .urgency-btn.selected {
    border-color: var(--accent); background: rgba(46,166,255,.1); color: var(--accent);
  }
  .file-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 14px; border: 1px dashed var(--border); border-radius: 12px;
    background: var(--field-bg); color: var(--hint); cursor: pointer;
  }
  .file-btn.filled { color: var(--text); border-style: solid; border-color: var(--accent); }
  .file-btn svg { flex: none; }
  #file { display: none; }
  #preview { margin-top: 10px; max-width: 100%; max-height: 220px; border-radius: 12px; display: none; }
  .hint-line { font-size: 12px; color: var(--hint); margin-top: 6px; }
  #error {
    display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    background: rgba(255,59,48,.12); color: #ff3b30; font-size: 14px;
  }
  #submit {
    position: sticky; bottom: 0; margin-top: 24px; width: 100%;
    padding: 15px; font-size: 16px; font-weight: 600;
    color: var(--accent-text); background: var(--accent);
    border: none; border-radius: 12px; cursor: pointer;
  }
  #submit:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <h1>Новая потребность</h1>

  <input id="sector" type="hidden" value="Закупки">

  <label for="order_no">Сток / Номер заказа</label>
  <input id="order_no" type="text" placeholder="Например: СТ-1234 или ЗАК-567" maxlength="100">

  <label for="description">Что нужно</label>
  <textarea id="description" placeholder="Например: Метизы М10, 200 шт, оцинкованные" rows="3" maxlength="500"></textarea>

  <label for="needed_by">Нужно к дате</label>
  <input id="needed_by" type="date">

  <label>Срочность</label>
  <div class="urgency-row">
    <div class="urgency-btn selected" data-val="обычная">Обычная</div>
    <div class="urgency-btn" data-val="скоро">&#9889; Скоро</div>
    <div class="urgency-btn" data-val="срочно">&#128308; Срочно</div>
  </div>

  <label>Фото / файл (необязательно)</label>
  <label class="file-btn" id="fileBtn" for="file">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span id="fileLabel">Прикрепить фото или чертёж</span>
  </label>
  <input id="file" type="file" accept="image/*,application/pdf">
  <img id="preview" alt="">
  <div class="hint-line">Фото, чертёж, образец — поможет закупщику найти нужное.</div>

  <div id="error"></div>

  <button id="submit">Отправить потребность</button>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = (id) => document.getElementById(id);
  const errorBox = $("error");
  const submitBtn = $("submit");
  let selectedUrgency = "обычная";

  function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
  function clearError() { errorBox.style.display = "none"; }

  // Срочность — кнопки
  document.querySelectorAll(".urgency-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".urgency-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      selectedUrgency = btn.dataset.val;
    });
  });

  // Дата по умолчанию — через неделю
  const d = new Date(); d.setDate(d.getDate() + 7);
  $("needed_by").value = d.toISOString().split("T")[0];

  // Сектор зафиксирован

  // Превью файла
  $("file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    const btn = $("fileBtn"), label = $("fileLabel"), prev = $("preview");
    if (!f) { label.textContent = "Прикрепить фото или чертёж"; btn.classList.remove("filled"); prev.style.display = "none"; return; }
    label.textContent = f.name;
    btn.classList.add("filled");
    if (f.type.startsWith("image/")) {
      prev.src = URL.createObjectURL(f); prev.style.display = "block";
    } else {
      prev.style.display = "none";
    }
  });

  submitBtn.addEventListener("click", async () => {
    clearError();
    const order_no = $("order_no").value.trim();
    const description = $("description").value.trim();
    const needed_by = $("needed_by").value;

    if (!order_no) return showError("Укажите сток или номер заказа.");
    if (!description) return showError("Опишите, что вам нужно.");
    if (!needed_by) return showError("Укажите дату.");

    const fd = new FormData();
    fd.append("initData", tg ? tg.initData : "");
    fd.append("sector", $("sector").value);
    fd.append("order_no", order_no);
    fd.append("description", description);
    fd.append("needed_by", needed_by);
    fd.append("urgency", selectedUrgency);
    const file = $("file").files[0];
    if (file) fd.append("file", file);

    submitBtn.disabled = true;
    submitBtn.textContent = "Отправляю…";
    try {
      const resp = await fetch("submit", { method: "POST", body: fd });
      const data = await resp.json();
      if (data.ok) {
        if (tg) { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.close(); }
        else { document.body.innerHTML = "<h1>Потребность " + data.request_no + " отправлена закупщику.</h1>"; }
      } else {
        showError(errorText(data.error));
        submitBtn.disabled = false; submitBtn.textContent = "Отправить потребность";
      }
    } catch (e) {
      showError("Сеть недоступна, попробуйте ещё раз.");
      submitBtn.disabled = false; submitBtn.textContent = "Отправить потребность";
    }
  });

  function errorText(code) {
    const map = {
      auth_failed: "Не удалось подтвердить, что потребность отправляете вы. Откройте форму через кнопку в боте.",
      no_user: "Не удалось определить отправителя. Откройте форму через кнопку в боте.",
      not_allowed: "Вы не закреплены за сектором. Обратитесь к директору, чтобы он вас добавил.",
      no_order_no: "Укажите сток или номер заказа.",
      order_no_too_long: "Номер заказа слишком длинный (макс. 100 символов).",
      empty_fields: "Опишите, что вам нужно.",
      no_description: "Опишите, что вам нужно.",
      description_too_long: "Описание слишком длинное (макс. 500 символов).",
      bad_date: "Укажите дату.",
      file_too_big: "Файл слишком большой (максимум 15 МБ).",
      publish_failed: "Не получилось отправить потребность. Попробуйте ещё раз.",
    };
    return map[code] || "Что-то пошло не так. Попробуйте ещё раз.";
  }
</script>
</body>
</html>
