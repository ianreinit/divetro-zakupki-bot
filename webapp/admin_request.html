<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Административный платёж</title>
<script defer src="telegram_bootstrap.js?v=1"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1c1c1e);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --section-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --field-bg: var(--tg-theme-bg-color, #ffffff);
    --border: rgba(128,128,128,.28);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--section-bg); color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  label { display: block; font-size: 13px; color: var(--hint); margin: 14px 0 6px; }
  input, textarea {
    width: 100%; padding: 12px 14px; font-size: 16px;
    color: var(--text); background: var(--field-bg);
    border: 1px solid var(--border); border-radius: 12px; outline: none;
    appearance: none; -webkit-appearance: none;
    font-family: inherit;
  }
  textarea { resize: none; min-height: 60px; line-height: 1.4; }
  input:focus, textarea:focus { border-color: var(--accent); }
  .file-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 14px; border: 1px dashed var(--border); border-radius: 12px;
    background: var(--field-bg); color: var(--hint); cursor: pointer;
  }
  .file-btn.filled { color: var(--text); border-style: solid; border-color: var(--accent); }
  .file-btn svg { flex: none; }
  #file { display: none; }
  #preview { margin-top: 10px; max-width: 100%; max-height: 220px; border-radius: 12px; display: none; }
  #error {
    display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px;
    background: rgba(255,59,48,.12); color: #ff3b30; font-size: 14px;
  }
  #submit {
    position: sticky; bottom: 0; margin-top: 24px; width: 100%;
    padding: 15px; font-size: 16px; font-weight: 600;
    color: var(--accent-text); background: var(--accent);
    border: none; border-radius: 12px; cursor: pointer;
  }
  #submit:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body inert>
  <h1>🏢 Административный платёж</h1>

  <label for="supplier">Поставщик / получатель *</label>
  <input id="supplier" type="text" placeholder="Название поставщика" maxlength="200">

  <label for="amount">Сумма *</label>
  <input id="amount" type="text" inputmode="decimal" placeholder="Например: 42500">

  <label for="naryad">Назначение — необязательно</label>
  <input id="naryad" type="text" placeholder="За что платим" maxlength="100">

  <label>Фото или PDF счёта — необязательно</label>
  <div class="file-btn" id="fileBtn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
    <span id="fileLabel">Добавить счёт — необязательно</span>
  </div>
  <input id="file" type="file" accept="image/*,application/pdf">
  <img id="preview" alt="">

  <div id="error"></div>

  <button id="submit">Отправить бухгалтеру</button>

<script>
window.addEventListener('DOMContentLoaded', async () => {
  try { if (!window.telegramReady) throw new Error('Не удалось загрузить окно. Проверьте соединение.'); await window.telegramReady; }
  catch (error) {
    document.body.inert = false;
    const box = document.createElement('div'); box.setAttribute('role', 'alert');
    box.style.cssText = 'padding:20px;background:#fff0ed;color:#8b2020;position:fixed;inset:0;z-index:100;';
    box.textContent = error.message + ' ';
    const retry = document.createElement('button'); retry.textContent = 'Повторить';
    retry.onclick = () => location.reload(); box.append(retry); document.body.append(box); return;
  }
  document.body.inert = false;

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  const $ = (id) => document.getElementById(id);

  function showError(msg) { $("error").textContent = msg; $("error").style.display = "block"; }
  function clearError() { $("error").style.display = "none"; }

  $("fileBtn").addEventListener("click", (e) => { e.preventDefault(); $("file").click(); });

  $("file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    const btn = $("fileBtn"), label = $("fileLabel"), prev = $("preview");
    if (!f) { label.textContent = "Добавить счёт — необязательно"; btn.classList.remove("filled"); prev.style.display = "none"; return; }
    label.textContent = f.name;
    btn.classList.add("filled");
    if (f.type.startsWith("image/")) {
      prev.src = URL.createObjectURL(f); prev.style.display = "block";
    } else {
      prev.style.display = "none";
    }
  });

  $("submit").addEventListener("click", async () => {
    clearError();
    const supplier = $("supplier").value.trim();
    const amountRaw = $("amount").value.trim().replace(/\s/g, "").replace(",", ".");
    const naryad = $("naryad").value.trim();
    const file = $("file").files[0];

    if (!supplier) return showError("Укажите поставщика.");
    if (!amountRaw || !Number.isFinite(Number(amountRaw)) || Number(amountRaw) <= 0) return showError("Укажите сумму числом.");

    const fd = new FormData();
    fd.append("initData", tg ? tg.initData : "");
    fd.append("supplier", supplier);
    fd.append("amount", amountRaw);
    fd.append("naryad", naryad);
    if (file) fd.append("file", file);

    $("submit").disabled = true;
    $("submit").textContent = "Отправляю…";
    try {
      const resp = await fetch("admin_request_submit", { method: "POST", body: fd });
      const data = await resp.json();
      if (data.ok) {
        if (tg) { tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success"); tg.close(); }
        else { document.body.innerHTML = "<h1>Заявка " + (data.request_no || "") + " отправлена бухгалтеру.</h1>"; }
      } else {
        showError(errorText(data.error));
        $("submit").disabled = false; $("submit").textContent = "Отправить бухгалтеру";
      }
    } catch (e) {
      showError("Сеть недоступна, попробуйте ещё раз.");
      $("submit").disabled = false; $("submit").textContent = "Отправить бухгалтеру";
    }
  });

  function errorText(code) {
    const map = {
      auth_failed: "Не удалось подтвердить вашу личность. Откройте форму через кнопку в боте.",
      no_user: "Не удалось определить отправителя.",
      not_director: "Форма доступна только директору.",
      bad_purpose: "Назначение: максимум 100 символов.",
      bad_file: "Можно прикрепить фото или PDF счёта.",
      no_supplier: "Укажите поставщика.",
      bad_amount: "Укажите корректную сумму.",
      file_too_big: "Файл слишком большой (максимум 15 МБ).",
      publish_failed: "Не получилось отправить заявку. Попробуйте ещё раз.",
    };
    return map[code] || "Что-то пошло не так. Попробуйте ещё раз.";
  }
});
</script>
</body>
</html>
